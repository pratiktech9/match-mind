# PostgreSQL. Versions 9.3 and up are supported.
#   gem install pg
#
#   Ensure the PostgreSQL gem is defined in your Gemfile
#   gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # username: <%= ENV.fetch("DATABASE_USERNAME") { "postgres" } %>
  # password: <%= ENV.fetch("DATABASE_PASSWORD") { "password" } %>
  # host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>

development:
  <<: *default
  database: match_mind_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: match_mind_test

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    database: match_mind_production
    username: match_mind
    password: <%= ENV["MATCH_MIND_DATABASE_PASSWORD"] %>
  cache:
    <<: *default
    database: match_mind_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: match_mind_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: match_mind_production_cable
    migrations_paths: db/cable_migrate
